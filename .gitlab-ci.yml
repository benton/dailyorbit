include:
  - template: Jobs/Code-Quality.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - test
  - build
  - deploy

variables:
  GL_IMAGE: $CI_REGISTRY_IMAGE
  CS_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  VITE_SERVER_URL: "https://api.dailyorbit.org"
  VITE_NEWSPAPER_IMAGES_URL: ""
  SAST_DEFAULT_ANALYZERS: "semgrep"

# ---------------------------------------------------------------------------
# Build — runs in parallel with test via needs: []
# ---------------------------------------------------------------------------
build:
  stage: build
  needs: []
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker run --rm --privileged tonistiigi/binfmt --install arm64
    - docker buildx create --use --name cibuilder --driver docker-container
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      TAGS="--tag $GL_IMAGE:$CI_COMMIT_SHORT_SHA"
      if [ -n "$CI_COMMIT_TAG" ]; then
        SANITIZED_TAG=$(echo "$CI_COMMIT_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
        TAGS="$TAGS --tag $GL_IMAGE:$SANITIZED_TAG --tag $GL_IMAGE:latest"
      fi
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg VITE_SERVER_URL="$VITE_SERVER_URL" \
        --build-arg VITE_NEWSPAPER_IMAGES_URL="$VITE_NEWSPAPER_IMAGES_URL" \
        --cache-from type=registry,ref=$GL_IMAGE:buildcache \
        --cache-to type=registry,ref=$GL_IMAGE:buildcache,mode=max \
        $TAGS \
        --push \
        .
  rules:
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Test
# ---------------------------------------------------------------------------
test:
  stage: test
  image: node:23-slim
  variables:
    CI: "true"
    # Log-noise reduction: silence env warnings that don't indicate problems
    DEBIAN_FRONTEND: "noninteractive"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    BROWSERSLIST_IGNORE_OLD_DATA: "1"
    NODE_OPTIONS: "--disable-warning=ExperimentalWarning"
  before_script:
    - apt-get update -qq && apt-get install -y -qq file >/dev/null
    - corepack enable pnpm
    - pnpm install --frozen-lockfile
  script:
    - pnpm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

# Container scanning runs after the image is pushed
container_scanning:
  stage: build
  needs: [build]
  variables:
    CS_DOCKER_IMAGE_PLATFORM: "linux/arm64"
  rules:
    - if: $CI_COMMIT_TAG

# ---------------------------------------------------------------------------
# Deploy — tagged releases only, manual gate; deploys to ed (huskynet)
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  needs: [build, test]
  image: alpine:3.22
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$ED_DEPLOY_KEY" | tr -d '\r' | ssh-add -
    # Pin ed's public host key — TOFU (accept-new) is meaningless on an
    # ephemeral runner and this channel carries sudo commands.
    - mkdir -p ~/.ssh
    - echo "[ed.h.usky.io]:2222 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJFhZM0a7Ppu1aJeawOjWPWYM3RLCqNZoTbKc2YasirQ" > ~/.ssh/known_hosts
  script:
    - SANITIZED_TAG=$(echo "$CI_COMMIT_TAG" | sed 's/[^a-zA-Z0-9._-]/-/g')
    - |
      ssh -p 2222 -o StrictHostKeyChecking=yes dailyorbit-deploy@ed.h.usky.io "
        set -eu
        sudo docker pull $CI_REGISTRY_IMAGE:$SANITIZED_TAG
        sudo sed -i \"s|$CI_REGISTRY_IMAGE:[^ ]*|$CI_REGISTRY_IMAGE:$SANITIZED_TAG|\" /etc/systemd/system/daily-orbit.service
        sudo systemctl daemon-reload
        sudo systemctl restart daily-orbit
        sleep 5
        sudo systemctl is-active daily-orbit || { sudo journalctl -u daily-orbit -n 30 --no-pager; exit 1; }
        curl -fsS --retry 10 --retry-delay 3 --retry-all-errors http://127.0.0.1:9010/api/health
      "
  environment:
    name: production
    url: https://dailyorbit.org
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false
